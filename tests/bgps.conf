# BGP Simulator Configuration File
# Lines starting with # or ! are comments

# First BGP router instance with AS 100
router bgp 100
  neighbor 1.1.1.1 remote-as 200
  neighbor 2.2.2.2 remote-as 300

# Second BGP router instance with AS 1
router bgp 1
  neighbor 3.3.3.3 remote-as 300
  neighbor 4.4.4.4 remote-as 500

# ============================================================
# RIB-OUT Blocks - BGP Route Generation
# ============================================================

# Simple route injection - 100 prefixes with single path
ribout customer-routes
  prefix 10.0.0.0/24 x 100
  path-id 0
  next-hop 192.168.1.1
  as-path 100 200 300
  localpref 100
  origin igp
!

# ADD-PATH testing - Multiple paths per prefix
ribout addpath-demo
  prefix 172.16.0.0/16 x 20
  path-id 0 1 2 3
  next-hop 192.168.2.1
  as-path 100 200
  localpref 150
  origin igp
!

# Load balancing - Nexthop cycling for ECMP
ribout ecmp-routes
  prefix 192.168.0.0/24 x 40
  path-id 0
  next-hop 10.10.1.0 x 8
  as-path 100 { 200 300 } 400
  localpref rand(200)
  origin egp
!

# Diverse paths - Random AS-paths for topology diversity
ribout internet-routes
  prefix 203.0.113.0/24 x 50
  path-id 0
  next-hop 198.51.100.1
  as-path 100 200 [rand(65000) x 10]
  localpref rand(300)
  origin incomplete
!
